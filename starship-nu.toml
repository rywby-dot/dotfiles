# ~/.config/starship-nu.toml

add_newline = false

# Nushell keeps its stock directory prompt and vi-mode indicators. Starship
# contributes only Git information on the left and command duration on the right.
format = "$git_branch$git_state$git_status"
right_format = "$cmd_duration"


# ============================================================
# Git
# ============================================================

[git_branch]
symbol = ""
style = "bold green"
format = "[$branch]($style)"
truncation_length = 32
truncation_symbol = "…"

[git_state]
style = "bold red"
format = ' [$state( $progress_current/$progress_total)]($style)'

[git_status]
style = "bold yellow"
format = '([$ahead_behind$stashed$conflicted$staged$modified$untracked$renamed$deleted]($style))'

ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇣${behind_count}⇡${ahead_count}"
stashed = " *${count}"
conflicted = " ~${count}"
staged = " +${count}"
modified = " !${count}"
untracked = " ?${count}"
renamed = " »${count}"
deleted = " ✘${count}"


# ============================================================
# Command duration (right prompt)
# ============================================================

[cmd_duration]
min_time = 1
format = "[$duration]($style)"
style = "bold yellow"
show_milliseconds = true
